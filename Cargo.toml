[package]
name = "pikpak"
version = "0.1.1"
edition = "2021"
# Verified with `cargo +1.86.0 check --locked --all-targets`. This crate's own
# code only needs 1.82, but the committed lockfile pulls in dependencies that
# require 1.86 (icu/idna) and edition2024 (clap_lex, Rust 1.85).
rust-version = "1.86"
description = "PikPak cloud storage client: a CLI for listing and resumable downloads, and the library behind it"
license = "MIT"
repository = "https://github.com/youming-ai/pikpak-downloader"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
md-5 = "0.10"
hex = "0.4"
# The CLI's own dependencies; a library user can opt out with
# `default-features = false`.
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
humansize = { version = "2", optional = true }

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:dotenvy", "dep:tracing-subscriber", "dep:humansize"]

[[bin]]
name = "pikpak"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
